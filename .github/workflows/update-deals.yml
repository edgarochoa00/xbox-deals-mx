name: Actualización Automática de Ofertas Xbox

on:
  schedule:
    # Se ejecuta automáticamente todos los martes y viernes a la 1:00 PM (Hora México)
    - cron: '0 19 * * 2,5'
  workflow_dispatch:

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build games catalogue
        run: |
          node scripts/build_games_json.cjs
          node scripts/fetch_steam_images.cjs

      - name: Commit and push updated deals
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/games.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: actualización automática de ofertas Xbox [skip ci]"
          git push
